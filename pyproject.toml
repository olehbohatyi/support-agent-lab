[project]
name = "support-agent-lab"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.14.0",
    "django>=6.1.3",
    "djangorestframework>=3.18.3",
    "httpx>=0.29.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "RUF"]
# RUF012 flags Django idioms (Meta.ordering, ModelAdmin.list_display) as mutable class defaults.
ignore = ["RUF012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
